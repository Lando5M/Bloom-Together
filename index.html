<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5e9e5"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Bloom Together</title></head><body><header><strong>✿ Bloom Together</strong><button id="settingsBtn">⚙ Settings</button></header><main><section id="home"><h1>Good conversations start here.</h1><p>Choose a deck and get a little closer.</p><div id="decks" class="grid"></div><button id="newDeck">+ Create a deck</button></section><section id="play" hidden><button id="back">← All decks</button><h2 id="deckTitle"></h2><div id="card"><small id="progress"></small><p id="question"></p><button id="favorite">♡ Save</button></div><div class="actions"><button id="previous">← Previous</button><button id="next">Next →</button><button id="shuffle">Shuffle</button></div><button id="addQuestion">+ Add question to this deck</button></section><section id="saved" hidden><h1>Favorite questions</h1><div id="savedList"></div></section><section id="settings" hidden><h1>Settings</h1><label>Appearance <select id="theme"><option value="light">Warm light</option><option value="dark">Dark</option></select></label><p>Back up your questions and favorites before clearing browser data.</p><button id="export">Export backup</button><button id="import">Import backup</button><input id="importFile" type="file" accept="application/json" hidden><button id="reset">Reset app data</button></section></main><nav><button data-page="home">⌂ Home</button><button data-page="saved">♡ Favorites</button><button data-page="settings">⚙ Settings</button></nav><script src="app.js"></script></body></html>

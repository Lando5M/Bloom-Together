<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5e9e5"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Bloom Together</title></head><body><header><strong>✿ Bloom Together</strong><button id="settingsBtn">⚙ Settings</button></header><main><section id="home"><h1>Good conversations start here.</h1><p>Choose a deck and get a little closer.</p><div class="toolbar"><label>Depth <select id="depthFilter"><option value="all">All depths</option><option value="light">Light</option><option value="meaningful">Meaningful</option><option value="deep">Deep</option><option value="vulnerable">Vulnerable</option></select></label><button id="randomChallenge">🎲 Random challenge</button></div><div id="decks" class="grid"></div><button id="newDeck">+ Create a deck</button></section><section id="play" hidden><button id="back">← All decks</button><h2 id="deckTitle"></h2><div class="toolbar playbar"><label>Mode <select id="gameMode"><option value="solo">Classic</option><option value="turns">Take turns</option><option value="couples">Couples night</option><option value="group">Group play</option><option value="challenge">Random challenge</option></select></label><label>Players <input type="number" id="playerCount" min="2" max="12" value="2"></label><label>Depth <select id="playDepth"><option value="all">All depths</option><option value="light">Light</option><option value="meaningful">Meaningful</option><option value="deep">Deep</option><option value="vulnerable">Vulnerable</option></select></label></div><p id="turnIndicator" aria-live="polite"></p><div id="card"><small id="progress"></small><span id="depthBadge"></span><div class="card-face"><p id="question"></p></div><p id="flipHint">Tap card to flip · Swipe for next / previous</p><button id="favorite">♡ Save</button></div><div class="actions"><button id="previous">← Previous</button><button id="next">Next →</button><button id="shuffle">Shuffle</button><button id="flipCard">Flip card ↻</button></div><button id="addQuestion">+ Add question to this deck</button></section><section id="saved" hidden><h1>Favorite questions</h1><div id="savedList"></div></section><section id="settings" hidden><h1>Settings</h1><label>Card color <input type="color" id="cardColor" value="#edcdd5"></label><label>Background color <input type="color" id="backgroundColor" value="#f9f3ef"></label><label>Card font <select id="cardFont"><option value="serif">Classic serif</option><option value="sans">Modern sans</option><option value="hand">Playful handwritten</option></select></label><label>Deck cover style <select id="coverStyle"><option value="petals">Soft petals</option><option value="solid">Solid color</option><option value="outline">Outlined</option></select></label><label>Appearance <select id="theme"><option value="light">Warm light</option><option value="dark">Dark</option></select></label><p>Back up your questions and favorites before clearing browser data.</p><button id="export">Export backup</button><button id="import">Import backup</button><input id="importFile" type="file" accept="application/json" hidden><button id="reset">Reset app data</button></section></main><nav><button data-page="home">⌂ Home</button><button data-page="saved">♡ Favorites</button><button data-page="settings">⚙ Settings</button></nav><script src="questions.js"></script><script src="new-decks.js"></script><script src="app.js"></script><script src="enhancements.js"></script></body></html>
